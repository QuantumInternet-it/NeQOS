<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Startup inventory and hot experiment activation</title>
  <desc id="desc">The stable inventory supplies equipment, endpoints and boot configuration to DeviceOS and NodeEngine startup. An experiment network is chosen, validated against inventory and live read-backs, then activated through the scheduler. Only a successful activation permits scientific runs; failed activation can leave drift requiring reconciliation.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#414b57"/></marker></defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#1b1f24">
    <text x="24" y="34" font-size="22" font-weight="bold">Inventory starts processes; experiments activate settings</text>
    <g fill="#f5f7fa" stroke="#cfd5de" stroke-width="2">
      <rect x="24" y="66" width="270" height="90"/><rect x="364" y="66" width="260" height="90"/><rect x="694" y="66" width="240" height="90"/>
      <rect x="24" y="221" width="190" height="78"/><rect x="259" y="221" width="230" height="78"/><rect x="534" y="221" width="190" height="78"/><rect x="769" y="221" width="165" height="78"/>
    </g>
    <g fill="none" stroke="#414b57" stroke-width="3" marker-end="url(#arrow)">
      <path d="M294 111 H358"/><path d="M624 111 H688"/>
      <path d="M214 260 H253"/><path d="M489 260 H528"/><path d="M724 260 H763"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="159" y="96" font-weight="bold">inventory-1</text><text x="159" y="124">equipment + endpoints</text><text x="159" y="147" font-size="16">boot / driver configuration</text>
      <text x="494" y="103" font-weight="bold">Process startup</text><text x="494" y="134">DeviceOS + NodeEngine</text>
      <text x="814" y="103" font-weight="bold">Always-on equipment</text><text x="814" y="134">connected / ready</text>
      <text x="119" y="246" font-weight="bold">Choose</text><text x="119" y="278">experiment-1</text>
      <text x="374" y="246" font-weight="bold">Validate</text><text x="374" y="278">constraints + read-back</text>
      <text x="629" y="246" font-weight="bold">Activate</text><text x="629" y="278">scheduled writes</text>
      <text x="851" y="246" font-weight="bold">Run</text><text x="851" y="278">active network</text>
    </g>
    <g font-size="16">
      <text x="24" y="187">Inventory changes: restart affected processes with the intended startup configuration.</text>
      <text x="24" y="335">Experiment changes: validate and activate while idle; no equipment restart is required.</text>
      <text x="24" y="365" fill="#7a4300">Failed activation: inspect partial changes; unresolved drift blocks scientific runs.</text>
      <text x="24" y="404">A draft or successful validation is not an active experiment and does not reserve devices.</text>
    </g>
  </g>
</svg>
